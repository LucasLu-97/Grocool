name: Android Check

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'kugou/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

# No Gradle caching on purpose: the cross-round build cache kept producing
# inconsistent Kotlin compile state (the same jar's members resolved
# differently run to run), which made real errors undiagnosable.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build caches
        run: ./gradlew clean

      - name: Diagnose kugou on the app compile classpath
        run: |
          ./gradlew -q :app:dependencies --configuration prodDebugCompileClasspath 2>/dev/null | grep -A2 -- '--- project :kugou' | head -20 || echo "KUGOU NOT ON CLASSPATH"

      - name: Assemble prod debug (no signing secrets needed)
        run: ./gradlew assembleProdDebug -Pbitchord.bundleWear=false

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grocool-prod-debug
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
