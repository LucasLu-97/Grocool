name: Release Build

on:
  workflow_dispatch:

# A signed prod-release APK, on demand: R8 + resource shrinking + per-ABI
# splits, the build users actually sideload. The debug CI build answers
# "does it compile"; this answers "what does it weigh".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup signing (Grocool keystore from repo secrets)
        env:
          KS_PASS: ${{ secrets.GRCOOL_KEYSTORE_PASS }}
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > grocool-release.jks
          printf 'storeFile=grocool-release.jks\nstorePassword=%s\nkeyAlias=androiddebugkey\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > keystore.properties
          ls -la grocool-release.jks keystore.properties

      - name: Assemble signed prod release
        run: ./gradlew assembleProdRelease -Pbitchord.bundleWear=false

      - name: List APK outputs
        run: ls -la app/build/outputs/apk/prod/release/

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: grocool-prod-release-signed
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
