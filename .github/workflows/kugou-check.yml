name: Kugou Check

on:
  push:
    branches: [main]
    paths:
      - 'kugou/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run kugou module tests
        run: ./gradlew :kugou:test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kugou-test-reports
          path: kugou/build/reports/tests/**
